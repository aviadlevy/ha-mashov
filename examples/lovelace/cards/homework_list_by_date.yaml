# ------------------------------------------------------------
# Mashov – Homework grouped by date (newest first)
#
# PREREQUISITES (install once)
# - From HACS → Frontend install: config-template-card, html-card
# - Settings → Dashboards → Resources (type: module):
#     /hacsfiles/config-template-card/config-template-card.js
#     /hacsfiles/html-card/html-card.js
#
# HOW TO USE
# - Replace sensor.mashov_<studentID>_homework in BOTH places below with your
#   homework sensor (Developer Tools → States, filter "homework").
# - UI dashboard: add a "Manual" card and paste this whole file.
#   YAML dashboard: use !include (see the main README).
# - The visual editor cannot edit this card; use the code editor.
#
# DATA
# - Reads the structured `items` attribute first. Falls back to
#   `formatted_by_date` only when `items` is empty, so the card keeps working
#   when the sensor trims its formatted attributes to stay under the size limit.
# - JavaScript comments use /* */ only: the folded block below is joined into
#   one line, so // comments would swallow the rest of the code.
# ------------------------------------------------------------

type: custom:config-template-card
entities:
  - sensor.mashov_<studentID>_homework
card:
  type: custom:html-card
  content: >-
    ${(function(){
    var id='sensor.mashov_<studentID>_homework';
    var LIMIT=5;
    var s=states[id];
    var empty='<div dir="rtl" style="text-align:right;padding:8px;opacity:.8;">אין נתונים להצגה</div>';
    if(!s||!s.attributes){return empty;}
    var a=s.attributes;
    function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
    var groups={};
    function add(key,label,entry){(groups[key]||(groups[key]={k:key,d:label,items:[]})).items.push(entry);}
    var items=Array.isArray(a.items)?a.items:[];
    if(items.length){
      for(var i=0;i<items.length;i++){
        var it=items[i]||{};
        var p=String(it.lesson_date||'').slice(0,10).split('-');
        if(p.length<3)continue;
        var body=it.homework||'';
        if(it.remark){body+=' ('+it.remark+')';}
        add(parseInt(p[0]+p[1]+p[2],10),p[2]+'/'+p[1]+'/'+p[0],{lesson:it.lesson,subject:it.subject_name||'',body:body});
      }
    }else{
      /* Fallback format: "שיעור <lesson> - <subject>: <text>" keyed by dd/mm/yyyy */
      var by=a.formatted_by_date||{};
      for(var d in by){
        if(!Object.prototype.hasOwnProperty.call(by,d))continue;
        var q=String(d).split('/');
        if(q.length<3)continue;
        var list=by[d]||[];
        for(var j=0;j<list.length;j++){
          var m=String(list[j]||'').match(/^שיעור\s*(\S*)\s+-\s+([^:]*):\s*([\s\S]*)$/);
          add(parseInt(q[2]+q[1].padStart(2,'0')+q[0].padStart(2,'0'),10),d,m?{lesson:m[1],subject:m[2].trim(),body:m[3]}:{lesson:'',subject:'',body:list[j]});
        }
      }
    }
    var rows=Object.keys(groups).map(function(k){return groups[k];}).sort(function(x,y){return y.k-x.k;});
    if(!rows.length){return empty;}
    var pal=['#f44336','#e91e63','#9c27b0','#673ab7','#3f51b5','#2196f3','#03a9f4','#00bcd4','#009688','#4caf50','#8bc34a','#cddc39','#ffc107','#ff9800','#ff5722','#795548','#607d8b'];
    var student=a.student_name||(a.friendly_name||'').trim()||'שם תלמיד/ה';
    var out='<div dir="rtl" style="text-align:right;"><h3 style="margin:0 0 8px;font-size:16px;">שיעורי בית — '+esc(student)+'</h3><div style="opacity:.8;margin-bottom:10px;">'+esc(a.formatted_summary||'')+'</div>';
    for(var r=0;r<rows.length&&r<LIMIT;r++){
      var row=rows[r];
      out+='<details'+(r===0?' open':'')+' dir="rtl" style="margin:10px 0;border:1px solid rgba(0,0,0,.08);border-radius:10px;padding:10px;"><summary style="cursor:pointer;display:flex;gap:8px;align-items:center;font-weight:700;"><span>'+esc(row.d)+'</span><span style="opacity:.7;">('+row.items.length+' פריטים)</span></summary>';
      for(var n=0;n<row.items.length;n++){
        var e=row.items[n];
        var key=String(e.subject||'').toLowerCase().trim(),acc=0;
        for(var c=0;c<key.length;c++){acc=(acc*31+key.charCodeAt(c))>>>0;}
        out+='<div style="display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid rgba(0,0,0,.06);"><div style="flex:none;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;background:'+pal[acc%pal.length]+';">'+esc(String(e.subject||'').trim().charAt(0)||'•')+'</div><div style="flex:1;min-width:0;"><div style="font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">'+esc(e.subject||'')+'</div><div style="font-size:12px;opacity:.8;">'+(e.lesson!=null&&e.lesson!==''?'שיעור '+esc(e.lesson)+' — ':'')+esc(e.body)+'</div></div></div>';
      }
      out+='</details>';
    }
    if(rows.length>LIMIT){out+='<div style="opacity:.7;font-size:12px;margin-top:6px;">... ועוד '+(rows.length-LIMIT)+' תאריכים</div>';}
    return out+'</div>';
    })()}

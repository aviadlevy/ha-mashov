name: Release

on:
  release:
    types: [published]

jobs:
  release:
    name: Publish release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate version
        run: |
          VERSION=$(cat VERSION)
          TAG=${GITHUB_REF#refs/tags/v}
          if [ "$VERSION" != "$TAG" ]; then
            echo "Version mismatch: VERSION=$VERSION, TAG=$TAG"
            exit 1
          fi

      - name: Create release asset
        run: |
          cd custom_components
          zip -r ../mashov.zip mashov/ -x "*/__pycache__/*" "*.pyc"
          cd ..

      - name: Upload release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" ./mashov.zip --clobber

      - name: Notify HACS
        run: |
          echo "Release published. HACS will automatically detect the new version."


name: "Bug report"
description: "Something isn’t working as expected"
title: "[Bug]: "
labels: ["bug", "needs-triage"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Before you open a new issue, please **search existing issues** to avoid duplicates.

        Please **do not upload personal or sensitive data**. Before attaching logs, diagnostics, screenshots, or JSON payloads, review them and redact usernames, student names, IDs, grades, homework text, cookies, tokens, email addresses, phone numbers, and any other private account or school data.

  - type: input
    id: short_title
    attributes:
      label: "Title"
      description: "A short, descriptive title of the problem."
      placeholder: "e.g., 'Schedule not running at configured time'"
    validations:
      required: true

  - type: textarea
    id: system_health
    attributes:
      label: "System Health details"
      description: "Paste the output from the System Health card in Home Assistant."
      placeholder: "Go to Developer Tools → Info → System Health → Copy, then paste here."
      render: shell
    validations:
      required: true

  - type: checkboxes
    id: checklist
    attributes:
      label: "Checklist"
      options:
        - label: "I have included the technical event summary or reviewed diagnostic information."
          required: true
        - label: "I have filled out the issue template to the best of my ability."
          required: true
        - label: "This issue only contains **one** problem."
          required: true
        - label: "This is **not** a duplicate of an existing issue."
          required: true
        - label: "I reviewed all attached logs, diagnostics, screenshots, and pasted text and removed personal or sensitive data."
          required: true

  - type: textarea
    id: description
    attributes:
      label: "Describe the issue"
      description: "A clear and concise description of what the issue is."
      placeholder: "What happened? What did you expect to happen?"
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: "Reproduction steps"
      description: "Without steps to reproduce, it’s hard to fix. Be specific."
      placeholder: |
        1. …
        2. …
        3. …
        ...
    validations:
      required: true

  - type: textarea
    id: debug_logs
    attributes:
      label: "Debug logs"
      description: "The HA notification offers a report with or without technical logs (error types, timestamps and code locations only). Exception messages and raw HA logs are excluded."
      render: shell
      placeholder: |
        <paste relevant logs enclosed in triple backticks>
        ```text
        …
        ```
    validations:
      required: true

  - type: textarea
    id: log_attachments
    attributes:
      label: "Log files (optional)"
      description: "In Settings → Devices & Services → Mashov, download diagnostics for the affected hub. Drag the JSON file here (or save it as .txt). It includes up to 20 sanitized internal-error records from the current HA session. You may also attach relevant manually redacted HA debug logs. Review every attachment before uploading."
      placeholder: "Drag a reviewed diagnostic/log file here, or paste a relevant redacted excerpt."
    validations:
      required: false

  - type: textarea
    id: diagnostics
    attributes:
      label: "Diagnostics dump"
      description: "Drag-and-drop the generated diagnostics file into this comment box (GitHub will attach it). If not possible, paste relevant JSON here. Review and redact any personal or sensitive data first."
      render: json
      placeholder: "{ … }"
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        _Remember, contributions should follow this repository’s contributing guidelines._


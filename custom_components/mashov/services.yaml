refresh_now:
  name: "רענן נתונים"
  description: "רענן את נתוני משחב עבור תלמידים"
  fields:
    entry_id:
      name: "מזהה כניסה"
      description: "מזהה הכניסה הספציפית לרענון (אופציונלי - אם לא מוגדר, ירענן את כל הכניסות)"
      required: false
      selector:
        text: {}

set_options:
  name: "עדכון אפשרויות (ללא Configure)"
  description: "עדכן אפשרויות של ההאב דרך Service Call כאשר כפתור Configure לא זמין"
  fields:
    entry_id:
      name: "מזהה כניסה"
      description: "מזהה ההאב לעדכון (אם לא צוין, ההאב הראשון שנטען)"
      required: false
      selector:
        config_entry:
          integration: mashov
    schedule_type:
      name: "סוג לוח זמנים"
      description: "daily | weekly | interval"
      required: false
      selector:
        select:
          options:
            - daily
            - weekly
            - interval
    schedule_time:
      name: "שעת רענון"
      description: "HH:MM או HH:MM:SS עבור daily/weekly"
      required: false
      selector:
        text: {}
    schedule_day:
      name: "יום בשבוע (יחיד)"
      description: "0=Mon .. 6=Sun (תאימות לאחור)"
      required: false
      selector:
        number:
          min: 0
          max: 6
          mode: box
    schedule_days:
      name: "ימים בשבוע (רבים)"
      description: "רשימת ימים 0..6 עבור weekly"
      required: false
      selector:
        object: {}
    schedule_interval:
      name: "מרווח בדקות"
      description: "עבור interval בלבד (5..1440)"
      required: false
      selector:
        number:
          min: 5
          max: 1440
          mode: box
    homework_days_back:
      name: "ימים אחורה לשיעורי בית"
      required: false
      selector:
        number:
          min: 0
          max: 60
          mode: box
    homework_days_forward:
      name: "ימים קדימה לשיעורי בית"
      required: false
      selector:
        number:
          min: 1
          max: 120
          mode: box
    api_base:
      name: "API Base"
      required: false
      selector:
        text: {}
    automatic_school_year:
      name: "Automatic school year"
      selector:
        boolean: {}
    max_items_in_attributes:
      name: "Maximum stored items"
      selector:
        number:
          min: 10
          max: 500
          mode: box
    additional_data:
      name: "Additional student data"
      selector:
        select:
          multiple: true
          translation_key: additional_data
          options:
            - message_board
            - daily_behavior
            - outside_behavior
            - follow_up
            - periodic_grades
            - report_cards
            - study_materials
            - student_files
            - justification_requests
